[package]
name = "raysend-core"
version = "0.1.0"
edition = "2021"
description = "Platform-neutral RaySend protocol, fountain codes, compression, QR raster, and scan"
publish = false

[features]
default = ["codec"]
# 喷泉 / 压缩 / 画码。解码 Worker 关掉本 feature，只留 rqrr + quircs。
codec = ["dep:brotli", "dep:qrcode", "dep:raptorq", "dep:sha2"]

[dependencies]
brotli = { version = "8.0.2", optional = true }
qrcode = { version = "0.14.1", optional = true }
quircs = "0.10.3"
raptorq = { version = "2.0", optional = true }
rqrr = { version = "0.9", default-features = false }
sha2 = { version = "0.10", optional = true }
