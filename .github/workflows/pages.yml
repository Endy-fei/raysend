name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dioxus-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7.10"

      - name: Build
        working-directory: crates/raysend-web
        run: dx bundle --release --platform web --package raysend-web --bin raysend-web --out-dir ../../dist

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          cname: raysend.myconjure.com
          force_orphan: true
