[workspace]
members = [
    "crates/raysend-core",
    "crates/raysend-decode",
    "crates/raysend-desktop",
    "crates/raysend-ffi",
    "crates/raysend-web",
]
default-members = [
    "crates/raysend-core",
    "crates/raysend-desktop",
    "crates/raysend-ffi",
]
resolver = "2"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

# 改完本段后必须重启 `dx serve`，否则增量编译仍用旧优化级别。
# RaptorQ 建编码器在低优化级别下会占满 WASM 主线程，看起来像卡死。
[profile.wasm-dev.package.raptorq]
opt-level = 3

[profile.wasm-dev.package.brotli]
opt-level = 3

[profile.wasm-dev.package.raysend-core]
opt-level = 3

[profile.wasm-dev.package.rqrr]
opt-level = 3

[profile.wasm-dev.package.quircs]
opt-level = 3

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
